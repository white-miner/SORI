<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="소통하는 리뷰, SORI — 에스테틱 케어 리포트와 AI 리뷰 작성">
  <meta name="theme-color" content="#5B4CDB">
  <meta name="color-scheme" content="light">

  <!-- PWA / Android Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="소통하는 리뷰, SORI">

  <!-- iOS Safari 홈 화면 추가 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="소통하는 리뷰, SORI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>소통하는 리뷰, SORI</title>
  <link rel="manifest" href="manifest.json">

  <!-- printing 패키지 웹 PDF 미리보기용 Pdf.js -->
  <script>
    var dartPdfJsBaseUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  </script>

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #5B4CDB;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Safe Area는 Flutter SafeArea / MediaQuery.padding 이 처리 (viewport-fit=cover) */
    flt-glass-pane, flutter-view {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Smart Guide Camera — MediaPipe FaceLandmarker (throttled rAF) -->
  <script src="sori_face_align.js" defer></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
