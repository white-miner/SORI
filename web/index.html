  <meta charset="UTF-8">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Flutter 루트 = 뷰포트 1:1 (100vh 스크롤바/주소창 오프셋 방지) */
    flt-glass-pane,
    flutter-view,
    flt-scene-host {
      position: absolute !important;
      inset: 0 !important;
      height: 100% !important;
      width: 100% !important;
      max-height: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      transform: none !important;
    }
    /* 카메라 HtmlElementView 등 플랫폼 뷰가 터치를 가로채지 않도록 */
    flt-platform-view,
    flt-platform-view-slot {
      pointer-events: none !important;
    }
  </style>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- ?v= 캐시 버스팅 — CI가 run_number로 치환 -->
  <script>
    (function () {
      var meta = document.querySelector('meta[name="sori-build"]');
      var build = meta && meta.getAttribute('content');
      if (!build) return;
      var key = 'sori_web_build_v1';
      var prev = null;
      try { prev = localStorage.getItem(key); } catch (_) {}
      function remember() {
        try { localStorage.setItem(key, build); } catch (_) {}
      }
      if (!prev) { remember(); return; }
      if (prev === build) return;
      // 새 배포 감지 → SW/Cache Storage 폐기 후 1회 하드 리로드
      var finish = function () {
        remember();
        var u = new URL(window.location.href);
        u.searchParams.set('_sb', build);
        window.location.replace(u.toString());
      };
      var p = Promise.resolve();
      if ('serviceWorker' in navigator) {
        p = navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        });
      }
      p.then(function () {
        if (!window.caches || !caches.keys) return;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        });
      }).then(finish).catch(finish);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=2026082517" async></script>
</body>
